name: Export task from DEV
on:
  workflow_dispatch:
    inputs:
      task:
        description: Replicate task name to export from DEV
        required: true

jobs:
  export:
    runs-on: [self-hosted, windows]
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Export the task without endpoints
        shell: bash
        env:
          QEM_HOST: ${{ vars.QEM_HOST }}
          QEM_SERVER: ${{ vars.REPLICATE_SERVER }}
          QEM_PAT: ${{ secrets.QEM_PAT }}
          QEM_USER: ${{ secrets.QEM_USER }}
          QEM_PASSWORD: ${{ secrets.QEM_PASSWORD }}
          TASK: ${{ inputs.task }}
        run: ./scripts/qem_export.sh
      - name: Commit to a branch
        shell: bash
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          git config user.name "replicate-bot"
          git config user.email "replicate-bot@users.noreply.github.com"
          git add "tasks/${TASK}.json"
          if git diff --cached --quiet; then
            echo "No changes to ${TASK}; nothing to commit."
            exit 0
          fi
          BRANCH="export/${TASK}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "Export ${TASK} from DEV"
          git push origin "$BRANCH"
          echo "Open a pull request: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1" >> "$GITHUB_STEP_SUMMARY"
