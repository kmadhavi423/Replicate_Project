name: Export tasks from DEV
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Task names separated by commas (or ALL for every task on DEV, which also picks up DEV-only tasks)'
        required: true

jobs:
  export:
    runs-on: [self-hosted, windows]
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Export the tasks without endpoints
        shell: bash
        env:
          QEM_HOST: ${{ vars.QEM_HOST }}
          QEM_SERVER: ${{ vars.REPLICATE_SERVER }}
          QEM_PAT: ${{ secrets.QEM_PAT }}
          QEM_USER: ${{ secrets.QEM_USER }}
          QEM_PASSWORD: ${{ secrets.QEM_PASSWORD }}
          TASKS: ${{ inputs.tasks }}
        run: ./scripts/qem_export.sh
      - name: Commit changed task files to a branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "replicate-bot"
          git config user.email "replicate-bot@users.noreply.github.com"
          git add tasks
          if git diff --cached --quiet; then
            echo "No task files changed; nothing to commit."
            echo "No task files changed, so there is nothing to promote." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CHANGED=$(git diff --cached --name-status)
          BRANCH="export/dev-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "Export tasks from DEV" -m "$CHANGED"
          git push origin "$BRANCH"
          {
            echo "### Changed task files"
            echo "$CHANGED" | sed 's/^/- /'
            echo ""
            echo "Open a pull request: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"