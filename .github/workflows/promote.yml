name: Promote Replicate tasks
on:
  push:
    branches: [main]
    paths: ['tasks/**']
  workflow_dispatch:   # a manual run imports every task file

jobs:
  changes:
    runs-on: ubuntu-latest   # this job needs no QEM access
    outputs:
      files: ${{ steps.diff.outputs.files }}
      any: ${{ steps.diff.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            FILES=$(ls tasks/*.json 2>/dev/null || true)
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'tasks/*.json')
          fi
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
            if [ -n "$FILES" ]; then echo 'any=true'; else echo 'any=false'; fi
          } >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: [self-hosted, windows]
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Import changed tasks into TEST
        shell: bash
        env:
          QEM_HOST: ${{ vars.QEM_HOST }}
          QEM_SERVER: ${{ vars.REPLICATE_SERVER }}
          QEM_PAT: ${{ secrets.QEM_PAT }}
          QEM_USER: ${{ secrets.QEM_USER }}
          QEM_PASSWORD: ${{ secrets.QEM_PASSWORD }}
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
        run: ./scripts/qem_import.sh

  prod:
    needs: [changes, test]
    if: needs.changes.outputs.any == 'true'
    runs-on: [self-hosted, windows]
    environment: prod   # add required reviewers on this environment
    steps:
      - uses: actions/checkout@v4
      - name: Import changed tasks into PROD
        shell: bash
        env:
          QEM_HOST: ${{ vars.QEM_HOST }}
          QEM_SERVER: ${{ vars.REPLICATE_SERVER }}
          QEM_PAT: ${{ secrets.QEM_PAT }}
          QEM_USER: ${{ secrets.QEM_USER }}
          QEM_PASSWORD: ${{ secrets.QEM_PASSWORD }}
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
        run: ./scripts/qem_import.sh
