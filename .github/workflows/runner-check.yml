# =============================================================================
# Runner check
#
# Purpose : confirm the self-hosted runner can see bash, jq and curl.
# Start   : Actions > Runner check > Run workflow. It changes nothing.
# Run it  : after installing the runner, and after any change to the PATH.
# Needs   : the runner service running. No GitHub Environment.
# =============================================================================

name: Runner check
on: workflow_dispatch

jobs:
  check:
    runs-on: [self-hosted, windows]
    steps:
      - name: Check tools
        shell: bash
        run: |
          which bash
          bash --version | head -1
          jq --version
          curl --version | head -1
