# =============================================================================
# Baseline from PROD   (run once, at the start)
#
# Purpose : make Git and DEV match PROD before the first promotion.
# Start   : Actions > Baseline from PROD > Run workflow.
# Jobs    : export-prod  exports every PROD task into tasks/, commits it to
#                        main, and tags that commit promoted-prod
#           import-dev   imports the same files into the DEV server
# Needs   : prod Environment (PROD server) and dev Environment (DEV server).
#           It pushes to main directly, so allow that if main is protected.
#           DEV endpoints must exist and DEV tasks of the same names be stopped.
# =============================================================================

name: Baseline from PROD
on: workflow_dispatch

jobs:
  # Job 1: read every task from PROD into Git and tag the starting point.
  export-prod:
    runs-on: [self-hosted, windows]
    environment: prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Export all PROD tasks without endpoints
        shell: bash
        env:
          QEM_HOST: ${{ vars.QEM_HOST }}
          QEM_SERVER: ${{ vars.REPLICATE_SERVER }}
          QEM_PAT: ${{ secrets.QEM_PAT }}
          QEM_USER: ${{ secrets.QEM_USER }}
          QEM_PASSWORD: ${{ secrets.QEM_PASSWORD }}
        run: ./scripts/qem_baseline.sh export
      - name: Commit baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "replicate-bot"
          git config user.email "replicate-bot@users.noreply.github.com"
          git add tasks
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Baseline: PROD tasks [skip ci]"
          git push origin HEAD:main
      - name: Mark the baseline as promoted
        shell: bash
        run: |
          set -euo pipefail
          git tag -f promoted-prod HEAD
          git push -f origin refs/tags/promoted-prod

  # Job 2: import the same files into DEV.
  import-dev:
    needs: export-prod
    runs-on: [self-hosted, windows]
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import baseline into DEV
        shell: bash
        env:
          QEM_HOST: ${{ vars.QEM_HOST }}
          QEM_SERVER: ${{ vars.REPLICATE_SERVER }}
          QEM_PAT: ${{ secrets.QEM_PAT }}
          QEM_USER: ${{ secrets.QEM_USER }}
          QEM_PASSWORD: ${{ secrets.QEM_PASSWORD }}
        run: ./scripts/qem_baseline.sh import
